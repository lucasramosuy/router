name = "proxy"
main = "proxy.js"
account_id = "f66373a49d42210eded48739ed762afa"
compatibility_date = "2026-09-23"
compatibility_flags = []
workers_dev = true
preview_urls = false
no_bundle = true
find_additional_modules = false
rules = [{ type = "ESModule", globs = ["proxy.js"], fallthrough = false }]
keep_vars = true
logpush = false
send_metrics = false
tail_consumers = []

# Only these three routes belong to proxy. Never copy all zone routes here.
routes = [
  { pattern = "lucasramos.uy/*", zone_id = "1b45195369f2fa2fd6993ff365431d3c" },
  { pattern = "lucasramos.uy/normativa*", zone_id = "1b45195369f2fa2fd6993ff365431d3c" },
  { pattern = "lucasramos.uy/profe*", zone_id = "1b45195369f2fa2fd6993ff365431d3c" }
]

[placement]
mode = "off"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.issues]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
